worker_processes auto; # Количество рабочих процессов (auto - автоматическое определение)
pid /run/nginx.pid; # Файл, в котором хранится PID главного процесса

# Настройки событий
events {
    worker_connections 1024; # Максимальное количество соединений на рабочий процесс
}


# HTTP-сервер
http {
    # Основные настройки
    include /etc/nginx/mime.types; # Типы файлов
    default_type application/octet-stream; # Тип по умолчанию

    # Настройки логирования
    log_format main '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Настройки sendfile и keepalive
    sendfile on;
    keepalive_timeout 65;

    # Настройки сжатия
    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream sveltekit {
        server 127.0.0.1:3000;
        keepalive 8;
    }

    upstream server {
        server api:8000; # Используем имя сервиса Docker Compose
    }
    # Виртуальный хост по умолчанию
    server {
        listen 80 default_server; # Порт прослушивания
        server_name localhost; # Имя сервера

        location /api {
            proxy_pass http://server;
        }

        # Настройки location
        location / {
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-NginX-Proxy true;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://sveltekit;
            proxy_redirect off;
            error_page 502 = @static;
        }

        location @static {
            try_files $uri /index.html =502;
        }
    }
}
