services:
  web:
    networks:
      - inventix
    build: ./client
    restart: always
    container_name: client
    command: [ "bun", "run", "dev", "--host", "--port", "${PORT_CLIENT}" ]
    ports:
      - "${PORT_CLIENT}:5173"
    volumes:
      - "./client:/app"
      - "node_modules:/app/node_modules"
    depends_on:
      api:
        condition: service_healthy

  api:
    container_name: api
    networks:
      - inventix
    restart: always
    build: ./server
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${PORT_DB}/${POSTGRES_DB}
    ports:
      - "${PORT_API}:8000"
    volumes:
      - "./server:/app"
      - "venv:/app/.venv"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    container_name: db
    networks:
      - inventix
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${PORT_DB}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 30s
      timeout: 10s
      retries: 5

  pgweb:
    networks:
      - inventix
    container_name: pgweb
    restart: always
    image: sosedoff/pgweb
    ports:
      - "${PORT_PGWEB}:8081"
    links:
      - postgres:postgres
    environment:
      - PGWEB_DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    container_name: nginx
    networks:
      - inventix
    build: ./nginx
    restart: always
    ports:
      - 80:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      api:
        condition: service_healthy

volumes:
  node_modules:
  postgres_data:
  venv:


networks:
  inventix:
    driver: bridge
